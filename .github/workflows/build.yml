name: ffmpeg-wasm build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ffmpegwasm/ffmpeg.wasm
          ref: v12.15

      - uses: actions/checkout@v7
        with:
          path: override

      - name: Update pkg-config database
        run: sudo ldconfig

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache build
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build-cache-st
          key: build-cache-st-v1-${{ hashFiles('Dockerfile', 'Makefile', 'build/*', 'override/src/*') }}
          restore-keys: |
            build-cache-st-v1-

      - name: Build FFmpeg
        run: |
          cp override/src/Dockerfile Dockerfile
          make prd EXTRA_ARGS="--cache-from=type=local,src=build-cache-st --cache-to=type=local,dest=build-cache-st,mode=max"

      - run: |
          ls -lRh packages/core/dist/

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core
          path: packages/core/dist/*
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist

      - uses: actions/setup-node@v7
        with:
          node-version-file: "test/.nvmrc"

      - run: |
          npm ci
          CHROMIUM_BIN=$(which microsoft-edge) node test.mjs
          cat log.txt
        working-directory: test

      - uses: actions/upload-artifact@v7
        with:
          path: test/log.txt
          retention-days: 7
          archive: false

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate tag
        run: |
          if echo "$GITHUB_REF_NAME" | grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ok: $GITHUB_REF_NAME"
          else
            echo "invalid tag: $GITHUB_REF_NAME (expected vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist

      - uses: actions/download-artifact@v8
        with:
          name: log.txt
          path: test

      - uses: actions/setup-node@v7
        with:
          node-version-file: "test/.nvmrc"
          registry-url: "https://npm.pkg.github.com"
          package-manager-cache: false

      - run: |
          cp src/publish-package.json packages/core/package.json
          cp README.md packages/core/README.md

          cd packages/core
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version

      - id: pack
        run: |
          tarball="$(npm pack)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          npm publish "$tarball"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          gh release create "$GITHUB_REF_NAME" \
            "packages/core/${{ steps.pack.outputs.tarball }}" test/log.txt \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-branch:
    needs: test
    # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: ${{ runner.temp }}/dist-tmp

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout --orphan release-latest
          git rm --quiet --force -r .
          cp --recursive "$RUNNER_TEMP/dist-tmp/." .
          git add --all
          git commit --message "publish $GITHUB_REF_NAME"

          git push --force --quiet origin release-latest

      - run: |
          branch="release-latest"
          commit=$(git rev-parse --short=7 HEAD)

          echo "jsdelivr branch: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${branch}/umd/ffmpeg-core.js"
          echo "jsdelivr commit: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${commit}/umd/ffmpeg-core.js"
