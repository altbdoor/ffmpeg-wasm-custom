name: ffmpeg-wasm build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ffmpegwasm/ffmpeg.wasm
          ref: v12.15

      - uses: actions/checkout@v7
        with:
          path: override

      - name: Update pkg-config database
        run: sudo ldconfig

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache build
        id: cache-build
        uses: actions/cache@v6
        with:
          path: build-cache-st
          key: build-cache-st-v1-${{ hashFiles('Dockerfile', 'Makefile', 'build/*', 'override/src/*') }}
          restore-keys: |
            build-cache-st-v1-

      - name: Build FFmpeg
        run: |
          cp override/src/Dockerfile Dockerfile
          make prd EXTRA_ARGS="--cache-from=type=local,src=build-cache-st --cache-to=type=local,dest=build-cache-st,mode=max"

      - run: |
          ls -lRh packages/core/dist/

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core
          path: packages/core/dist/*
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist

      - uses: actions/setup-node@v7
        with:
          node-version-file: "test/.nvmrc"

      - run: |
          npm ci
          CHROMIUM_BIN=$(which microsoft-edge) node test.mjs
          cat log.txt
        working-directory: test

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-log
          path: test/log.txt
          retention-days: 7
          archive: false

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate tag
        run: |
          if echo "$GITHUB_REF_NAME" | grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ok: $GITHUB_REF_NAME"
          else
            echo "invalid tag: $GITHUB_REF_NAME (expected vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-log
          path: test

      - uses: actions/setup-node@v7
        with:
          node-version-file: "test/.nvmrc"
          registry-url: "https://registry.npmjs.org"

      - run: |
          version="${GITHUB_REF_NAME#v}"
          cp src/publish-package.json packages/core/package.json
          cd packages/core
          npm version "$version" --no-git-tag-version

      - run: npm publish --provenance
        working-directory: packages/core

      - run: |
          tar czf ffmpeg-core.tgz --directory packages/core dist

          gh release create "$GITHUB_REF_NAME" \
            ffmpeg-core.tgz test/log.txt \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
